<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            background-color: #f5f5f7;
            margin-top: 100px;
        }
        .form-style {
            border: 1px solid;
            width: 300px;
            height: 230px;
            padding: 20px;
            text-align: center;
            margin: auto;
            border-radius: 10px;
        }
        .input-style {
            border: 1px solid black;
            padding: 4px;
            border-radius: 10px;

        }
        .btn {
            background-color: blue;
            color: white;
            font-weight: bolder;
            padding: 4px;
            font-size: large;
            cursor: pointer;
            border-radius: 10px;
        }
        .div-msg {
            margin: auto;
            margin-bottom: 15px;
            text-align: center;
            width: 350px;
        }
        .ptag {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="div-msg">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
        <p class="ptag"> {{ msg }} </p>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <form action="form_add_expense" method="POST" class="form-style">
        <label for="tname"><b>Title</b> :</label>
        <input type="text" name="titlename" id="tname" placeholder="e.g.  burgar , car" required class="input-style"><br><br>

        <label for="cname"><b>Category</b> :</label>
        <input type="text" name="categoryname" id="cname" placeholder="e.g.  food , vehicle" required class="input-style"><br><br>

        <label for="pname"><b>Price</b> :</label>
        <input type="number" name="pricee" id="pname" placeholder="enter price of expense" required class="input-style"><br><br>

        <label for="dname"><b>Date</b> :</label>
        <input type="date" name="datee" id="dname" required class="input-style"><br><br><br>

        <button type="submit" class="btn">submit</button>

    </form>
</body>
</html>
