<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            background-color: #f5f5f7;
        }
        .container {
            
            width: 820px;
            text-align: center;
            margin: auto;
        }
        .tab-style {
            text-align: center;
            padding-left: 30px;
            padding-right: 30px;
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }
        .th,td {
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <table border="1" class="tab-style">
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Date</th>
            </tr>
            {% for exp in expense %}
            <tr>
                <td> {{ exp[0] }} </td>
                <td> {{ exp[1] }} </td>
                <td> {{ exp[2] }} </td>
                <td> {{ exp[3] }} </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
